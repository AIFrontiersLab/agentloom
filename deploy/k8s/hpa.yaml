apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-budget-controller
  namespace: agent-budget-controller
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agent-budget-controller}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
