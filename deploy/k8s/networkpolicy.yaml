apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-budget-controller-ingress
  namespace: agent-budget-controller
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agent-budget-controller}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway}
      ports: [{port: 8080}]
